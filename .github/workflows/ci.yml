name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm run build -w @drawkaro/server

      - name: 4-player socket smoke test
        run: node apps/server/scripts/e2e.mjs

      - name: Restart drill (rooms survive a kill)
        run: node apps/server/scripts/restart-test.mjs

      - name: Mobile typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Mobile lint
        working-directory: apps/mobile
        run: npx eslint src --max-warnings=0
