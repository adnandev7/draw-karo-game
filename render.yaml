# Render.com blueprint — free-tier game server for Draw Karo.
#
# The web app is NOT deployed here: it is a static Expo export and lives on
# Vercel (see `vercel.json`). Only the long-lived Socket.IO server needs a
# always-on process, which is what Render provides.
#
# One-time setup:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → pick the repo.
#   3. Copy the service URL (https://<name>.onrender.com) into Vercel's
#      EXPO_PUBLIC_GAME_SERVER env var.
#
# Why rootDir ".": the server imports @drawkaro/shared and @drawkaro/words,
# so the workspace packages must be built from the repo root before the
# server compiles. Building inside apps/server alone cannot resolve them.
services:
  - type: web
    name: draw-karo-server
    runtime: node
    plan: free
    region: singapore # closest free region to India
    rootDir: .
    buildCommand: npm ci && npm run build:packages && npm run build -w @drawkaro/server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      # Voice chat (M4) — leave empty until LiveKit is wired:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

